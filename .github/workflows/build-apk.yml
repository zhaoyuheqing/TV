name: Build FongMi TV Single APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout source
      uses: actions/checkout@v4

    - name: Setup JDK 17
      uses: actions/setup-java@v4
      with:
        distribution: temurin
        java-version: 17
        cache: gradle

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Upgrade pip
      run: python -m pip install --upgrade pip

    - name: Set Chaquopy Python path
      run: echo "CHAQUOPY_BUILD_PYTHON=$(which python)" >> $GITHUB_ENV

    - name: Grant gradlew permission
      run: chmod +x gradlew

    - name: Build TV Leanback Release (arm64)
      run: ./gradlew assembleLeanbackRelease --no-daemon --parallel --build-cache

    - name: Show APK files
      run: find app/build/outputs -name "*.apk"

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: fongmi-tv-arm64
        path: app/build/outputs/**/*.apk
