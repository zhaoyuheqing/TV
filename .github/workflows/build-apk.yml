name: Build FongMi TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies for Chaquopy
      run: |
        python -m pip install --upgrade pip
        # 如果有 requirements.txt 或特定包，pip install 这里
        # Chaquopy 会用这个 Python

    - name: Set Chaquopy buildPython
      run: echo "CHAQUOPY_BUILD_PYTHON=$(which python)" >> $GITHUB_ENV

    - name: Grant execute permission for gradlew
      run: chmod +x gradlew

    - name: Build Release APK
      run: ./gradlew assembleRelease --stacktrace  # 加 --stacktrace 看详细错误

    - name: Upload APK artifact
      uses: actions/upload-artifact@v4
      with:
        name: fongmi-tv-release-apk
        path: app/build/outputs/apk/release/*.apk
