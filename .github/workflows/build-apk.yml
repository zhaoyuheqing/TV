name: Build FongMi TV APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:

    - name: Checkout code
      uses: actions/checkout@v4

    - name: Set up JDK 17
      uses: actions/setup-java@v4
      with:
        java-version: '17'
        distribution: 'temurin'
        cache: gradle

    - name: Set up Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install Python dependencies
      run: |
        python -m pip install --upgrade pip

    - name: Set Chaquopy buildPython
      run: echo "CHAQUOPY_BUILD_PYTHON=$(which python)" >> $GITHUB_ENV

    - name: Grant permission to gradlew
      run: chmod +x gradlew

    - name: Build APK
      run: |
        ./gradlew assembleDebug assembleRelease --stacktrace

    - name: Show build outputs
      run: |
        echo "===== APK OUTPUT FILES ====="
        ls -R app/build/outputs || true

    - name: Upload APK
      uses: actions/upload-artifact@v4
      with:
        name: fongmi-tv-apk
        path: app/build/outputs/**/*.apk
